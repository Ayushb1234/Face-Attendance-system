# add your compose services here (postgres, qdrant, backend, frontend)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: attendance
    ports: ["5432:5432"]
    volumes:
      - pg:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdata:/qdrant/storage

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [postgres, qdrant, redis]
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./backend:/app

  # frontend will be added in Part 3
  # frontend:
  #   build: ./frontend
  #   environment:
  #     NEXT_PUBLIC_API_URL: "http://localhost:8000"
  #     NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
  #   ports: ["3000:3000"]
  #   volumes: ["./frontend:/app"]

volumes:
  pg: {}
  qdata: {}
